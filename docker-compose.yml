services:
  sistema-npj-db-1:
    image: mysql:8.0
    container_name: sistema-npj-db-1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: ${DB_NAME:-npjdatabase}
      MYSQL_USER: ${DB_USER:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: npj-backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: sistema-npj-db-1
      DB_USER: ${DB_USER:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      DB_NAME: ${DB_NAME:-npjdatabase}
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Defina JWT_REFRESH_SECRET no arquivo .env}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TOKEN_EXPIRATION: 24h
      REFRESH_TOKEN_EXPIRATION: 7d
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_TEST_USERS: ${SEED_TEST_USERS:-true}
      TEST_PROFESSOR_1_EMAIL: ${TEST_PROFESSOR_1_EMAIL:-professor1@npj.local}
      TEST_PROFESSOR_1_PASSWORD: ${TEST_PROFESSOR_1_PASSWORD:-TesteNPJ@2026}
      TEST_PROFESSOR_2_EMAIL: ${TEST_PROFESSOR_2_EMAIL:-professor2@npj.local}
      TEST_PROFESSOR_2_PASSWORD: ${TEST_PROFESSOR_2_PASSWORD:-TesteNPJ@2026}
      TEST_ALUNO_1_EMAIL: ${TEST_ALUNO_1_EMAIL:-aluno1@npj.local}
      TEST_ALUNO_1_PASSWORD: ${TEST_ALUNO_1_PASSWORD:-TesteNPJ@2026}
      TEST_ALUNO_2_EMAIL: ${TEST_ALUNO_2_EMAIL:-aluno2@npj.local}
      TEST_ALUNO_2_PASSWORD: ${TEST_ALUNO_2_PASSWORD:-TesteNPJ@2026}
    depends_on:
      sistema-npj-db-1:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: npj-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: npj-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
